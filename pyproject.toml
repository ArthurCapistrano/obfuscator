[project]
name = "obfuscator"
version = "0.1.0"
description = "A simple data obfuscator in python"
authors = [
    {name = "arthurCapistrano",email = "arthur.capistrano12@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ignr (>=2.2,<3.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "mysql-connector-python (>=9.5.0,<10.0.0)"
]

[tool.poetry]
packages = [{include = "obfuscator", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
